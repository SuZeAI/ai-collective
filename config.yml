# ============================================================================
# AI Collective — Non-secret configuration
# ============================================================================
# This file holds NON-SECRET operational config (modes, timeouts, ports, URLs,
# budgets) plus references to secrets. It is committed to git.
#
# Layering, low → high priority:
#     code defaults  <  config.yml  <  .env  <  OS environment
# Anything set in .env or the shell overrides the value here.
#
# STRUCTURE: nested, lowercase keys. Each top-level section maps to one settings
# group; each leaf key is that group's field name. The loader resolves every
# leaf to its canonical env-var name and never clobbers a value already set by
# .env / the shell. Override the file location with CONFIG_FILE=...
#
# ENV REFERENCES: any value may embed `$VAR`, `${VAR}` or `${VAR:-default}`,
# expanded from the environment (.env / shell) at load time. Reference names are
# resolved case-insensitively — `$MONGO_URI` here pulls MONGO_URI from .env. Use
# this to pull a secret/host in without duplicating it. An unset var with no
# default becomes empty.
#
# SECRETS: real secret VALUES live in .env. They are declared in one place — the
# `secrets:` block at the bottom — and pulled in via ${VAR}; LLM provider keys
# stay grouped under `llm_keys:`. Nothing secret is hard-coded here.
#
# TOOLS / SKILLS: per-tool credentials are NO LONGER configured here. Each skill
# stores its own config (API keys, tokens, endpoints) in MongoDB, edited via the
# UI. Only the global tool flags under `security:` remain.
# ============================================================================

# Bump when the schema changes (renamed/moved sections). Currently informational.
config_version: 1

# ── Application ───────────────────────────────────────────────────────────────
app:
  environment: development            # development | production (prod enforces a strong JWT secret)
  api_prefix: /api/v1
  cors_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:2026,http://127.0.0.1:2026"
  frontend_url: http://localhost:2026
  vite_api_base_url: http://localhost:2026/api/v1

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  log_level: debug                    # critical | error | warning | info | debug
  log_console: true
  log_file: true
  log_max_bytes: 10485760
  log_backup_count: 5

# ── Models (model-driven LLM config, DeerFlow-style) ──────────────────────────
# Declarative chat-model registry (pattern: context/config.example.yaml). Each
# entry picks the LangChain chat-model class via `use: module:ClassName` and
# passes the remaining keys straight to it. `api_key` holds the secret (pulled
# from .env via $VAR; may be several comma-separated keys → rotation). For classes
# whose key kwarg is not `api_key`, set `api_key_field` (Google → google_api_key).
# `llm.active_model` below selects the active entry.
models:
  - name: gemini
    display_name: Gemini 3 Flash
    provider_name: Google
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-3-flash-preview
    api_key: $GOOGLE_API_KEY
    api_key_field: google_api_key
    supports_vision: true

  - name: claude
    display_name: Claude Sonnet 4
    provider_name: Anthropic
    use: langchain_anthropic:ChatAnthropic
    model: claude-sonnet-4-20250514
    api_key: $ANTHROPIC_API_KEY
    supports_vision: true

  - name: gpt-4o
    display_name: GPT-4o
    provider_name: OpenAI
    use: langchain_openai:ChatOpenAI
    model: gpt-4o
    api_key: $OPENAI_API_KEY

  - name: deepseek
    display_name: DeepSeek Chat
    provider_name: DeepSeek
    use: langchain_openai:ChatOpenAI
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1

  - name: kimi
    display_name: Kimi K2
    provider_name: Kimi
    use: langchain_openai:ChatOpenAI
    model: kimi-k2-0711-preview
    api_key: $KIMI_API_KEY
    base_url: https://api.moonshot.ai/v1

  - name: glm
    display_name: GLM 4.6
    provider_name: GLM
    use: langchain_openai:ChatOpenAI
    model: glm-4.6
    api_key: $GLM_API_KEY
    base_url: https://api.z.ai/api/paas/v4

  - name: open_weight
    display_name: OpenRouter (Qwen)
    provider_name: Open-weight
    use: langchain_openai:ChatOpenAI
    model: qwen/qwen3.5-397b-a17b
    api_key: $OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1

# ── LLM runtime (active model + key rotation) ─────────────────────────────────
# The model-driven `models:` list above is the config; `active_model` selects one.
# Provider API keys are referenced per-model via `api_key: $VAR` (pulled from .env).
llm:
  active_model: gemini                # which entry in `models:` above is active
  # api_base: http://localhost:11434/v1   # optional base URL for the embedding layer
  # ── Failover / key rotation ──
  # rotate  → built-in multi-key rotation (several comma-separated keys per model)
  # 9router → delegate to the 9Router gateway (aliases: router, nine-router, off)
  failover:
    strategy: rotate
    rotate_max_requests_per_min: 0    # per-key RPM budget, 0 = unlimited
    rotate_max_tokens_per_min: 0      # per-key TPM budget, 0 = unlimited
    key_cooldown_seconds: 60          # how long an errored key is skipped before retry

# ── Middleware (staff middleware stack, by component) ─────────────────────────
# Each block configures one middleware (see backend/infrastructure/llm/middleware/).
# Omit a block to fall back to its default. The always-on stack is ModelCallLimit
# + LoopDetection + ToolRetry + ToolTimeout; the rest activate when enabled.
middleware:
  loop_detection:
    enabled: true                     # break loops that repeat an identical tool call
    max_repeats: 3
  tool_retry:
    max: 2                            # retries for transient tool failures (0 = off)
  tool_call_limit:
    limit: 0                          # run-wide cap on tool executions (0 = off)
  tool_cache:
    enabled: false                    # serve identical idempotent tool calls from the run
    deny_tools: ""                    # comma-separated tools to never cache
  guardrail:
    deny_tools: ""                    # comma-separated tools to block outright
    deny_patterns: ""                 # comma-separated arg regexes to block
  pii_redaction:
    enabled: false                    # scrub emails/cards/secrets from tool results
  model_fallback:
    models: ""                        # comma-separated fallback model names
  model_retry:
    max: 0                            # retries on transient model errors (0 = off)
  context_editing:
    enabled: false                    # prune old tool outputs when input grows large
    trigger_tokens: 100000
    keep: 3
  summarization:
    enabled: false                    # LLM-based history summarization
    model: ""                         # required when enabled (a `models:` name)
    trigger_tokens: 8000
    keep_messages: 20
  rolling_summary:
    enabled: false                    # LLM-free history compactor → summary note
    trigger_tokens: 6000
    keep_messages: 10
  long_term_memory:
    enabled: false                    # recall LTM before model, persist salient after
  cost_budget:
    run_token_budget: 0               # soft-stop a run past this many tokens (0 = off)

# ── 9Router gateway (docker profile: router) ──────────────────────────────────
# router_jwt_secret / router_initial_password are secrets → see `secrets:` block.
router:
  port: 20128
  public_url: http://localhost:20128

# ── Agent / tools ─────────────────────────────────────────────────────────────
agent:
  max_tool_rounds: 6                  # max LLM<->tool rounds per agent turn
  tool_timeout_seconds: 0             # per-tool timeout, 0 = disabled
  subagent_max_concurrent: 3
  subagent_max_turns: 6
  context_token_limit: 12000          # context budget per agent turn
  output_token_reserve: 2000          # tokens reserved for the model's reply
  llm_timeout_seconds: 120            # per LLM call timeout
  llm_max_retries: 2                  # per LLM call retries
  ask_user_timeout_seconds: 600       # how long an ask_user prompt waits
  # mesh_fanout_max_concurrent:        # mesh fan-out cap (defaults to subagent_max_concurrent)

# ── Storage ───────────────────────────────────────────────────────────────────
storage:
  backend: mongo                      # json (file) | mongo
  dir: local_database                 # live DB dir (relative to project root)
  seed_dir: storage                   # read-only default catalog seeded FROM

# ── MongoDB (used when storage.backend=mongo) ─────────────────────────────────
# mongo_uri (contains credentials) is a secret → see `secrets:` block.
mongo:
  db: ai_collective

# ── Graph knowledge extraction ────────────────────────────────────────────────
graph:
  build_mode: static                  # static (spaCy, no token cost) | llm
  # llm_provider: google
  # llm_model: gemini-3-flash-preview
  # Knowledge-graph persistence: auto (follow storage backend) | neo4j
  # backend: neo4j                      # pip install '.[neo4j]'
  # neo4j_uri: bolt://localhost:7687
  # neo4j_user: neo4j
  # neo4j_password: ${NEO4J_PASSWORD}
  # neo4j_database: neo4j

# ── Task queue ────────────────────────────────────────────────────────────────
# rabbitmq_url (contains credentials) is a secret → see `secrets:` block.
task_queue:
  backend: rabbitmq                   # memory (single instance) | rabbitmq
  # Max staff-graph runs executing at once, system-wide across every
  # company/user (excess runs queue). The work is I/O-bound (LLM API calls),
  # not CPU-bound, so raise this well past core count if you have the
  # provider rate-limit/cost headroom — 3 caps an entire deployment at 3
  # concurrent runs total, which is very low for anything past a demo.
  max_concurrent: 10

# ── Repository lock ───────────────────────────────────────────────────────────
# redis_url (contains credentials) is a secret → see `secrets:` block.
lock:
  backend: redis                      # threading (single instance) | redis

# ── Sandbox ───────────────────────────────────────────────────────────────────
sandbox:
  mode: local                         # local | docker | k8s
  timeout: 120
  host: localhost
  # docker mode:
  # image: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
  # base_port: 8080
  # container_prefix: ai-collective-sandbox
  # replicas: 3
  # idle_timeout: 600
  # k8s mode:
  # provisioner_url: http://provisioner:8002

# ── Authentication / JWT ──────────────────────────────────────────────────────
# jwt_secret_key, google_login_client_id/secret, and the OAuth/credentials file
# paths are secrets → see `secrets:` block.
auth:
  jwt_algorithm: HS256
  jwt_access_token_expire_minutes: 10080   # 7 days
  google_login_redirect_uri: http://127.0.0.1:2026/api/v1/auth/google/callback
  google_oauth_redirect_uri: http://127.0.0.1:2026/api/v1/auth/oauth/callback

# ── Agent working memory (short-term, per-conversation) ───────────────────────
working_memory:
  enabled: true
  max_notes: 40
  compact_tokens: 1500
  note_chars: 600
  summary_chars: 3000
  digest_chars: 4000

# ── Embeddings (pluggable vector backend for real RAG) ────────────────────────
# OFF by default → graph / long-term memory fall back to lexical retrieval.
# provider: hashing (dependency-free) | google | openai | open_weight
embedding:
  enabled: false
  provider: hashing
  # model: text-embedding-3-small        # provider-specific; omit for hashing
  dim: 256
  batch_size: 64

# ── Long-term memory (cross-conversation; workspace + owner + agent scoped) ───
long_term_memory:
  enabled: false
  recall_top_k: 5
  min_importance: 0.0
  consolidate_on_run_end: true          # promote salient working-memory notes at run end
  dedupe_threshold: 0.92
  digest_chars: 2000

# ── RAG retrieval (extra context injected into the knowledge graph) ───────────
# mode: bm25 (default, local — no service) | qdrant (vector) | neo4j (graph)
#       | hybrid (Qdrant vector seeds + Neo4j graph expansion = GraphRAG)
# qdrant/hybrid also need embedding.enabled + a Qdrant service; neo4j/hybrid use
# the knowledge graph (best in Neo4j via graph.backend). Falls back to bm25.
retrieval:
  mode: bm25
  top_k: 5
  hops: 1                  # graph expansion depth for neo4j/hybrid
  max_chars: 1500

# ── Vector store (ANN index for long-term-memory recall) ──────────────────────
# backend: none (brute-force cosine) | faiss (local, pip install '.[faiss]')
#                                     | qdrant (service, pip install '.[qdrant]')
# Only used when embeddings are enabled; degrades to brute force if unavailable.
vector_store:
  backend: none
  # faiss_path: storage/vector_store      # faiss index dir (defaults under STORAGE_DIR)
  # qdrant_url: http://localhost:6333
  # qdrant_api_key: ${QDRANT_API_KEY}
  qdrant_collection: ltm_memory
  overfetch: 5                           # extra candidates fetched before scope filtering

# ── MCP (Model Context Protocol) ──────────────────────────────────────────────
# Per-server connection config is declared in mcp.yml (see that file).
mcp:
  discovery_timeout_seconds: 30       # list_tools handshake ceiling at bind time
  call_timeout_seconds: 60            # default per-tool-call timeout
  auto_seed: true                     # seed enabled servers from mcp.yml on boot
  config_file: mcp.yml                # path to the MCP declarations (relative to root)

# ── Admin bootstrap ───────────────────────────────────────────────────────────
# admin_password is a secret → see `secrets:` block.
admin:
  email: admin@aicollective.com
  name: Administrator
  auto_seed: true

# ── Default catalog seed ──────────────────────────────────────────────────────
seed:
  default_data: true

# ── Browser automation (agent browser tools) ──────────────────────────────────
browser:
  model_name: gemini-2.0-flash
  model_provider: google_genai
  temperature: 0.0
  max_tokens: 1024
  # api_base:

# ── Tool runtime flags (global, NOT per-skill) ────────────────────────────────
# Per-tool credentials are configured in the UI and stored in MongoDB. Only
# these process-wide flags remain in the file.
security:
  allow_private_http: false           # allow tools to reach private/loopback IPs
  last30days_debug: false             # verbose HTTP debug logging

# ============================================================================
# Secrets — declared here, VALUES live in .env and are pulled in via ${VAR}.
# Single declaration point for every non-LLM secret (LLM provider keys stay
# grouped under `llm_keys:` above). Keys are lowercase env-var names. An unset
# var expands to empty and .env / OS env still win (loader uses setdefault).
# ============================================================================
secrets:
  # Auth / JWT
  jwt_secret_key: ${JWT_SECRET_KEY}
  google_login_client_id: ${GOOGLE_LOGIN_CLIENT_ID}
  google_login_client_secret: ${GOOGLE_LOGIN_CLIENT_SECRET}
  google_oauth_client_secret_path: ${GOOGLE_OAUTH_CLIENT_SECRET_PATH}
  credentials_path: ${CREDENTIALS_PATH}
  service_account_path: ${SERVICE_ACCOUNT_PATH}
  # 9Router gateway
  router_jwt_secret: ${ROUTER_JWT_SECRET}
  router_initial_password: ${ROUTER_INITIAL_PASSWORD}
  # Datastores (credentials embedded in the URI)
  mongo_uri: ${MONGO_URI}
  rabbitmq_url: ${RABBITMQ_URL}
  redis_url: ${REDIS_URL}
  # Admin bootstrap
  admin_password: ${ADMIN_PASSWORD}
