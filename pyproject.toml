[project]
name = "ai-collective"
version = "0.1.0"
description = "AI – Collective: a multi-agent orchestration platform for programmable AI workforces (FastAPI backend)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "SuZeAI (SuzeNith)", email = "suzeai545@gmail.com" }]
dependencies = [
	"fastapi>=0.115.0",
	"uvicorn[standard]>=0.30.0",
	"pydantic[email]>=2.7.0",
	"pydantic-settings>=2.3.0",
	"python-dotenv>=1.0.1",
	"pyyaml>=6.0",
	"langchain>=1.2",
	"langchain-community>=0.2.0",
	"langchain-core>=0.2.0",
	"langchain-anthropic>=0.2.0",
	"langchain-google-genai>=1.0.7",
	"langchain-openai>=0.3.0",
	"langgraph>=0.2.34",
	"mcp>=1.9.0",
	"duckduckgo-search>=6.3.0",
	"browser-use>=0.12.3",
	"playwright>=1.58.0",
	"ddgs>=9.11.4",
	"rootutils>=1.0.7",
	"yt-dlp>=2026.3.17",
	"google-auth>=2.40.3",
	"google-auth-oauthlib>=1.2.2",
	"google-api-python-client>=2.181.0",
	"spacy>=3.8.7",
	"rembg[cpu]>=2.0.74",
	"pytest>=9.0.2",
	"motor>=3.4.0",
	"pymongo>=4.7.0",
	"requests>=2.31.0",
	"kubernetes>=28.1.0",
	"bcrypt>=4.0.0",
	"pyjwt>=2.0.0",
	"defusedxml>=0.7.1",
	"pypdf>=4.0.0",
	"openpyxl>=3.1.0",
	"python-docx>=1.1.0",
	"pillow>=10.0.0",
]

[project.optional-dependencies]
rabbitmq = ["pika>=1.3.0"]
redis = ["redis>=5.0.0"]
queue-all = ["pika>=1.3.0", "redis>=5.0.0"]
backup = ["minio>=7.2.0"]
# Vector store backends for long-term memory recall
faiss = ["faiss-cpu>=1.8.0", "numpy>=1.26.0"]
qdrant = ["qdrant-client>=1.9.0"]
# Neo4j knowledge-graph backend
neo4j = ["neo4j>=5.20.0"]

[tool.uvicorn]
app = "backend.api.main:app"
host = "0.0.0.0"
port = 8000

