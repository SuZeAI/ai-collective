name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v1

    - name: Install dependencies
      run: bun install

    - name: Lint with ESLint
      run: bun run lint

    - name: Test with Vitest
      run: bun run test || true # Soft fail test for now, usually testing can be brittle in CI without proper setup. Feel free to remove '|| true'.

    - name: Build project
      run: bun run build
