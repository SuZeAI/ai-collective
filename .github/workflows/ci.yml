name: CI

# Runs on every push to main and on every pull request targeting main, so
# contributions get checked before merge, not just after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # allows manual runs from the Actions tab

# Cancel any in-progress run for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest test/ -v
        env:
          PYTHONPATH: .

  frontend:
    name: Frontend · vitest + build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint doesn't block CI (the codebase still has existing warnings/
      # errors), but results are still shown so they can be cleaned up over time.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run vitest
        run: npm run test

      - name: Build
        run: npm run build
