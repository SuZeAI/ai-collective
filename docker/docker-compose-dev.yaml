# AI Collective — Development Environment
# Usage: docker compose -f docker/docker-compose-dev.yaml up --build
#
# Services:
#   - redis:       Task cancel signals + pause checkpoints
#   - rabbitmq:    Task execution queue (management UI: http://localhost:15672)
#   - nginx:       Reverse proxy (port 2026)
#   - frontend:    Next.js dev server with hot-reload
#   - gateway:     FastAPI Gateway with --reload
#   - langgraph:   LangGraph dev server
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Access: http://localhost:2026
# RabbitMQ Management: http://localhost:15672 (guest/guest)

services:
  # ── Redis (task cancel signals + pause checkpoints) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-collective-redis-dev
    command: redis-server --save "" --appendonly no
    networks:
      - ai-collective-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (task execution queue) ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ai-collective-rabbitmq-dev
    ports:
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    networks:
      - ai-collective-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: ai-collective-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=ai-collective
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${AI_COLLECTIVE_ROOT}/skills
      - THREADS_HOST_PATH=${AI_COLLECTIVE_ROOT}/backend/.ai-collective/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ai-collective-nginx
    ports:
      - "2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    environment:
      - LANGGRAPH_UPSTREAM=${LANGGRAPH_UPSTREAM:-langgraph:2024}
      - LANGGRAPH_REWRITE=${LANGGRAPH_REWRITE:-/}
    command:
      - sh
      - -c
      - |
        set -e
        envsubst '$$LANGGRAPH_UPSTREAM $$LANGGRAPH_REWRITE' \
          < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      - ai-collective-dev
    restart: unless-stopped

  # ── Frontend: Next.js Development Server ──────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: ai-collective-frontend
    command: sh -c "cd frontend && pnpm run dev > /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      - AI_COLLECTIVE_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - AI_COLLECTIVE_INTERNAL_LANGGRAPH_BASE_URL=http://langgraph:2024
    env_file:
      - ../frontend/.env
    networks:
      - ai-collective-dev
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: ai-collective-gateway
    command: sh -c "{ cd backend && (uv sync || (echo '[startup] uv sync failed; recreating .venv and retrying once' && uv venv --allow-existing .venv && uv sync)) && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --reload --reload-include='*.yaml .env'; } > /app/logs/gateway.log 2>&1"
    volumes:
      - ../backend/:/app/backend/
      - gateway-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills:/app/skills
      - ../logs:/app/logs
      - gateway-uv-cache:/root/.cache/uv
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - AI_COLLECTIVE_HOME=/app/backend/.ai-collective
      - AI_COLLECTIVE_CHANNELS_LANGGRAPH_URL=${AI_COLLECTIVE_CHANNELS_LANGGRAPH_URL:-http://langgraph:2024}
      - AI_COLLECTIVE_CHANNELS_GATEWAY_URL=${AI_COLLECTIVE_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - AI_COLLECTIVE_HOST_BASE_DIR=${AI_COLLECTIVE_ROOT}/backend/.ai-collective
      - AI_COLLECTIVE_HOST_SKILLS_PATH=${AI_COLLECTIVE_ROOT}/skills
      - AI_COLLECTIVE_SANDBOX_HOST=host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective-dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── LangGraph Server ───────────────────────────────────────────────────────
  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: ai-collective-langgraph
    command: sh -c "cd backend && { (uv sync || (echo '[startup] uv sync failed; recreating .venv and retrying once' && uv venv --allow-existing .venv && uv sync)) && allow_blocking='' && if [ \"\${LANGGRAPH_ALLOW_BLOCKING:-0}\" = '1' ]; then allow_blocking='--allow-blocking'; fi && uv run langgraph dev --no-browser \${allow_blocking} --host 0.0.0.0 --port 2024 --n-jobs-per-worker \${LANGGRAPH_JOBS_PER_WORKER:-10}; } > /app/logs/langgraph.log 2>&1"
    volumes:
      - ../backend/:/app/backend/
      - langgraph-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills:/app/skills
      - ../logs:/app/logs
      - langgraph-uv-cache:/root/.cache/uv
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - AI_COLLECTIVE_HOME=/app/backend/.ai-collective
      - AI_COLLECTIVE_HOST_BASE_DIR=${AI_COLLECTIVE_ROOT}/backend/.ai-collective
      - AI_COLLECTIVE_HOST_SKILLS_PATH=${AI_COLLECTIVE_ROOT}/skills
      - AI_COLLECTIVE_SANDBOX_HOST=host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective-dev
    restart: unless-stopped

volumes:
  gateway-venv:
  langgraph-venv:
  gateway-uv-cache:
  langgraph-uv-cache:

networks:
  ai-collective-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
