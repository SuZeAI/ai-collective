# AI Collective — Development Environment
# Usage: docker compose -f docker/docker-compose-dev.yaml up --build
#
# Services (always on in dev):
#   mongodb         — MongoDB database         (port 27017 exposed for local tools)
#   mongo-express   — MongoDB web UI           (http://localhost:8081)
#   redis           — distributed lock backend
#   redis-commander — Redis web UI             (http://localhost:8083)
#   rabbitmq        — task queue + management UI (http://localhost:15672)
#   nginx           — reverse proxy (port 2026, stats: http://localhost:2026/nginx_status)
#   frontend        — Vite dev server with hot-reload (port 8080 internal)
#   backend         — FastAPI with --reload (port 8000 internal)
#   sandbox         — AIO sandbox container (port 8081 exposed for debugging)
#   provisioner     — K8s sandbox provisioner (port 8002 exposed for debugging)
#
# Access: http://localhost:2026
# MongoDB Express:    http://localhost:8081  (admin/admin)
# Redis Commander:    http://localhost:8083  (no login required)
# RabbitMQ Mgmt UI:  http://localhost:15672 (guest/guest)
# Nginx status:      http://localhost:2026/nginx_status
# Sandbox direct:    http://localhost:8081  (if running)
# Provisioner:       http://localhost:8002/health
#
# Logs: run `make dev` — per-service log files are written to ./logs/<service>.log

# ── Shared logging configuration (log rotation for all services) ───────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ai-collective-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin}
      MONGO_INITDB_DATABASE: ai_collective
    volumes:
      - mongo_data:/data/db
    networks:
      - ai-collective-dev
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB Web UI ─────────────────────────────────────────────────────────
  mongo-express:
    image: mongo-express:1
    container_name: ai-collective-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-admin}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-admin}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_PASS:-admin}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ai-collective-dev
    logging: *default-logging

  # ── Redis (distributed lock backend) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-collective-redis-dev
    command: redis-server --save "" --appendonly no
    networks:
      - ai-collective-dev
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Commander (visual Redis browser) ────────────────────────────────
  # Access: http://localhost:8083
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ai-collective-redis-commander-dev
    environment:
      - REDIS_HOSTS=redis:redis:6379
    ports:
      - "8083:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-collective-dev
    restart: unless-stopped
    logging: *default-logging

  # ── RabbitMQ (task execution queue) ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ai-collective-rabbitmq-dev
    ports:
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    networks:
      - ai-collective-dev
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ai-collective-nginx-dev
    ports:
      - "2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command:
      - sh
      - -c
      - |
        set -e
        cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - backend
    networks:
      - ai-collective-dev
    restart: unless-stopped
    logging: *default-logging

  # ── Frontend: Vite Dev Server ──────────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: Dockerfile.frontend
      target: dev
    container_name: ai-collective-frontend-dev
    command: npm run dev -- --host 0.0.0.0 --port 8080
    volumes:
      - ../src:/app/src
      - ../public:/app/public
      - ../index.html:/app/index.html
      - ../vite.config.ts:/app/vite.config.ts:ro
      - ../tailwind.config.ts:/app/tailwind.config.ts:ro
      - ../postcss.config.js:/app/postcss.config.js:ro
      - ../tsconfig.json:/app/tsconfig.json:ro
      - ../tsconfig.app.json:/app/tsconfig.app.json:ro
      - ../components.json:/app/components.json:ro
    env_file:
      - ../.env
    environment:
      - NODE_ENV=development
    networks:
      - ai-collective-dev
    restart: unless-stopped
    logging: *default-logging

  # ── Backend: FastAPI with hot-reload ──────────────────────────────────────
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.9.5}
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    container_name: ai-collective-backend-dev
    command: >
      sh -c "uv sync --all-extras &&
      uv run uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../backend:/app/backend
      - ../secrets:/app/secrets
      - ../storage:/app/storage
      - ../logs:/app/logs
      - ../config.yml:/app/config.yml:ro
      - ../mcp.yml:/app/mcp.yml:ro
      - sandbox-workspace:/app/sandbox_workspace
      - backend-venv:/app/.venv
      - backend-uv-cache:/root/.cache/uv
    env_file:
      - ../.env
    environment:
      - GOOGLE_OAUTH_CLIENT_SECRET_PATH=/app/secrets/credentials/client_secret_126452164764-91jgaonrbbj8upq515jmr8cbnn6sqemt.apps.googleusercontent.com.json
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - STORAGE_BACKEND=${STORAGE_BACKEND:-json}
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-admin}@mongodb:27017/ai_collective?authSource=admin
      - MONGO_DB=${MONGO_DB:-ai_collective}
      # Sandbox mode: local | docker | k8s (see docs/SANDBOX.md).
      #   local → run commands in-process (default, no isolation)
      #   k8s   → set SANDBOX_MODE=k8s + SANDBOX_PROVISIONER_URL=http://provisioner:8002
      #           (activate the `provisioner` profile, e.g. `make dev-provisioner`)
      - SANDBOX_MODE=${SANDBOX_MODE:-local}
      - SANDBOX_PROVISIONER_URL=${SANDBOX_PROVISIONER_URL:-}
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-60}
      - SANDBOX_WORKSPACE=/app/sandbox_workspace
      - STORAGE_DIR=/app/storage
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PYTHONUNBUFFERED=1
    # Reach NodePort sandbox services on the host k3s node (k8s mode).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective-dev
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── AIO Sandbox Container (profile: sandbox) ───────────────────────────────
  # Standalone all-in-one sandbox container for manual / debug use. It is NOT
  # auto-wired to any SANDBOX_MODE in the current code: `docker` mode spawns its
  # own containers and `k8s` mode runs Pods via the provisioner. Start on its own
  # with `make dev-sandbox`; reach it at http://localhost:8081 on the host.
  sandbox:
    image: ${SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest}
    container_name: ai-collective-sandbox-dev
    ports:
      - "8081:8080"   # exposed as 8081 to avoid conflict with frontend's 8080
    volumes:
      - sandbox-workspace:/workspace
    networks:
      - ai-collective-dev
    restart: unless-stopped
    profiles:
      - sandbox
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/sandbox"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Sandbox Provisioner — K8s/k3s pod manager (profile: provisioner) ───────
  # Used by SANDBOX_MODE=k8s. Set in .env → SANDBOX_MODE=k8s
  #   SANDBOX_PROVISIONER_URL=http://provisioner:8002
  # Talks to the host's k3s API; see docs/K3S.md and docs/SANDBOX.md.
  provisioner:
    build:
      context: ./provisioner
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: ai-collective-provisioner-dev
    ports:
      - "8002:8002"
    environment:
      - K8S_NAMESPACE=${K8S_NAMESPACE:-ai-collective}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest}
      # How the backend container reaches NodePort services on the host node.
      - NODE_HOST=${NODE_HOST:-host.docker.internal}
      # The k3s kubeconfig points at 127.0.0.1:6443 (the container's own
      # loopback). Override so the client reaches the host's k3s API instead.
      - K8S_API_SERVER=${K8S_API_SERVER:-https://host.docker.internal:6443}
      - KUBECONFIG_PATH=/root/.kube/config
      # hostPath dirs on the k3s NODE (must already exist, else Pods FailedMount).
      - SKILLS_HOST_PATH=${SKILLS_HOST_PATH:-/skills}
      - THREADS_HOST_PATH=${THREADS_HOST_PATH:-/.ai-collective/threads}
    volumes:
      # Mount the kubeconfig FILE (compose does not expand `~`, so use $HOME).
      - ${KUBECONFIG:-${HOME}/.kube/config}:/root/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective-dev
    profiles:
      - provisioner
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 9Router — multi-provider LLM proxy (optional — profile: router) ────────
  # OpenAI-compatible gateway that routes / falls back across 40+ LLM providers
  # (Claude, OpenAI, Gemini, GLM…) and compresses tokens. https://github.com/decolua/9router
  # Activate: docker compose -f docker/docker-compose-dev.yaml --profile router up -d
  # 1. Open the dashboard:  http://localhost:${ROUTER_PORT:-20128}/dashboard
  # 2. Log in with the first-login password (ROUTER_INITIAL_PASSWORD, default 123456).
  # 3. Add provider accounts, create a combo + API key, then point the backend
  #    at it in .env (also set LLM_FAILOVER_STRATEGY=9router to disable local key rotation):
  #   LLM_PROVIDER=openai
  #   LLM_API_BASE=http://nine-router:20128/v1   # in-Docker service hostname
  #   OPENAI_API_KEY=<api key generated in the 9router dashboard>
  #   LLM_MODEL=<combo name or provider/model, e.g. cc/claude-opus-4-7>
  nine-router:
    image: decolua/9router:latest
    container_name: ai-collective-9router-dev
    profiles: ["router"]
    ports:
      - "${ROUTER_PORT:-20128}:20128"
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - JWT_SECRET=${ROUTER_JWT_SECRET:-change-me-use-openssl-rand-hex-32}
      - INITIAL_PASSWORD=${ROUTER_INITIAL_PASSWORD:-123456}
      - NEXT_PUBLIC_BASE_URL=${ROUTER_PUBLIC_URL:-http://localhost:20128}
    volumes:
      - router_data:/app/data
    networks:
      - ai-collective-dev
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:20128/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
    driver: local
  backend-venv:
  backend-uv-cache:
  sandbox-workspace:
  router_data:

networks:
  ai-collective-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
