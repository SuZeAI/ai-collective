# AI Collective — Production Environment
# Usage: docker compose -f docker/docker-compose.yaml up -d
#
# Services (always on):
#   mongodb    — MongoDB database           (port 27017 internal)
#   redis      — distributed lock backend  (enable: LOCK_BACKEND=redis)
#   rabbitmq   — task queue                (enable: TASK_QUEUE_BACKEND=rabbitmq)
#   nginx      — reverse proxy             (port 2026, override: PORT=xxxx)
#   frontend   — Vite React static server  (served by `serve`, port 8080 internal)
#   backend    — FastAPI application       (port 8000 internal)
#
# Optional services (Docker Compose profiles):
#   mongo-express   — MongoDB web UI       (profile: mongo-express, port 8081)
#                  Enable: docker compose --profile mongo-express up -d
#
#   redis-commander — Redis web UI         (profile: tools, port 8083)
#   rabbitmq-mgmt  — RabbitMQ Mgmt UI     (profile: tools, port 15672)
#                  Enable: docker compose --profile tools up -d
#
#   sandbox    — standalone AIO sandbox container (manual/debug; not auto-wired)
#                Enable: docker compose --profile sandbox up -d
#                Reach it at http://localhost:8081 on the host.
#
#   provisioner — K8s sandbox provisioner (creates per-request sandbox Pods)
#                Enable: docker compose --profile provisioner up -d
#                Then set in .env: SANDBOX_MODE=k8s  SANDBOX_PROVISIONER_URL=http://provisioner:8002
#
# Sandbox modes (SANDBOX_MODE, see docs/sandbox.md):
#   local (default) — run commands in-process on the backend (no isolation).
#   k8s             — activate profile "provisioner"; sandboxes run as k3s Pods.
#                     Set SANDBOX_PROVISIONER_URL=http://provisioner:8002 and provide a
#                     kubeconfig (see docs/k3s.md).
#
# Key environment variables (set in .env at project root):
#   LLM_PROVIDER / LLM_MODEL              — LLM provider & model
#   GOOGLE_API_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY
#   RABBITMQ_USER / RABBITMQ_PASS         — RabbitMQ credentials (default: guest/guest)
#   MONGO_USER / MONGO_PASS               — MongoDB credentials (default: admin/admin)
#   STORAGE_BACKEND                       — "json" (default) | "mongo"
#   SANDBOX_MODE                          — "local" (default) | "k8s"
#   SANDBOX_PROVISIONER_URL               — http://provisioner:8002 (if SANDBOX_MODE=k8s)
#   SANDBOX_TIMEOUT                       — command timeout in seconds (default: 60)
#   STORAGE_DIR                           — override storage directory path
#   PORT                                  — public port (default: 2026)
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ai-collective-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin}
      MONGO_INITDB_DATABASE: ai_collective
    volumes:
      - mongo_data:/data/db
    networks:
      - ai-collective
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB Web UI (optional — profile: mongo-express) ────────────────────
  # Activate: docker compose --profile mongo-express up -d
  mongo-express:
    image: mongo-express:1
    container_name: ai-collective-mongo-express
    restart: unless-stopped
    profiles: ["mongo-express"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-admin}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-admin}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_PASS:-admin}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ai-collective

  # ── Redis (distributed lock backend) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-collective-redis
    command: redis-server --save "" --appendonly no
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Commander (optional — profile: tools) ────────────────────────────
  # Activate: docker compose --profile tools up -d
  # Access: http://localhost:8083
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ai-collective-redis-commander
    profiles: ["tools"]
    environment:
      - REDIS_HOSTS=redis:redis:6379
    ports:
      - "8083:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-collective
    restart: unless-stopped

  # ── RabbitMQ (task execution queue) ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ai-collective-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    ports:
      - "15672:15672"
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ai-collective-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ai-collective
    restart: unless-stopped

  # ── Frontend: Vite React (static production build) ────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: Dockerfile.frontend
      target: prod
    container_name: ai-collective-frontend
    networks:
      - ai-collective
    restart: unless-stopped

  # ── Backend: FastAPI ───────────────────────────────────────────────────────
  backend:
    build:
      context: ../
      dockerfile: server/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.9.5}
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    container_name: ai-collective-backend
    command: uv run uvicorn server.api.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-4}
    volumes:
      # storage/seed/ is the committed read-only seed catalog (SEED_DIR);
      # storage/runtime/ is the per-machine live store (STORAGE_DIR, gitignored).
      - ../storage:/app/storage
      - ../logs:/app/logs
      - ../config.yml:/app/config.yml:ro
      - ../mcp.yml:/app/mcp.yml:ro
      - sandbox-workspace:/app/sandbox_workspace
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      # STORAGE_BACKEND is owned by config.yml (storage.backend → STORAGE_BACKEND). Do NOT
      # set it here — an env var would override config.yml. Override per-machine
      # via .env (STORAGE_BACKEND=...) if needed.
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-admin}@mongodb:27017/ai_collective?authSource=admin
      - MONGO_DB=${MONGO_DB:-ai_collective}
      # SANDBOX_MODE: local | k8s (see docs/sandbox.md).
      - SANDBOX_MODE=${SANDBOX_MODE:-local}
      - SANDBOX_PROVISIONER_URL=${SANDBOX_PROVISIONER_URL:-}
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT:-60}
      - SANDBOX_WORKSPACE=/app/sandbox_workspace
      # Live store lives in storage/runtime/ (gitignored), separate from the
      # committed storage/seed/ catalog. Used by json mode + json fallbacks.
      - STORAGE_DIR=/app/storage/runtime
      # File byte-store: local (host volume) | s3 (MinIO). Empty → auto (s3 when
      # MINIO_ENABLED, else local). s3 restores files on restart. See .env.template.
      - FILE_STORAGE_BACKEND=${FILE_STORAGE_BACKEND:-}
      # MinIO: durable backup of conversation sandbox files (profile: minio).
      - MINIO_ENABLED=${MINIO_ENABLED:-false}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-sandbox-backups}
      - MINIO_SECURE=${MINIO_SECURE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── Standalone AIO Sandbox Container (optional — profile: sandbox) ────────
  # Manual / debug container; NOT auto-wired to any SANDBOX_MODE (`k8s` mode
  # uses the provisioner instead).
  # Activate: docker compose --profile sandbox up -d
  sandbox:
    image: ${SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest}
    container_name: ai-collective-sandbox
    profiles: ["sandbox"]
    volumes:
      - sandbox-workspace:/workspace
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/sandbox"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Sandbox Provisioner — K8s/k3s pod manager (optional — profile: provisioner)
  # Used by SANDBOX_MODE=k8s. Activate: docker compose --profile provisioner up -d
  # Then set in .env: SANDBOX_MODE=k8s  SANDBOX_PROVISIONER_URL=http://provisioner:8002
  # Requires: a kubeconfig (see docs/k3s.md)
  provisioner:
    build:
      context: ./provisioner
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: ai-collective-provisioner
    profiles: ["provisioner"]
    environment:
      - K8S_NAMESPACE=${K8S_NAMESPACE:-ai-collective}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest}
      # How the backend container reaches NodePort services on the host node.
      - NODE_HOST=${NODE_HOST:-host.docker.internal}
      # The kubeconfig points at 127.0.0.1:6443 (container loopback); override
      # so the client reaches the host's k3s API instead.
      - K8S_API_SERVER=${K8S_API_SERVER:-https://host.docker.internal:6443}
      - KUBECONFIG_PATH=/root/.kube/config
    # SKILLS_HOST_PATH / THREADS_HOST_PATH come from .env via env_file below,
    # not ${VAR} interpolation — interpolation resolves against compose's
    # "project directory" (this file's folder), which has no .env of its own,
    # so it can silently fall back to hardcoded defaults even when root .env
    # sets them. app.py falls back to /skills and /.ai-collective/threads
    # itself when these are absent from .env.
    volumes:
      # Mount the kubeconfig FILE (compose does not expand `~`, so use $HOME).
      - ${KUBECONFIG:-${HOME}/.kube/config}:/root/.kube/config:ro
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8002:8002"
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 9Router — multi-provider LLM proxy (optional — profile: router) ────────
  # OpenAI-compatible gateway that routes / falls back across 40+ LLM providers
  # (Claude, OpenAI, Gemini, GLM…) and compresses tokens. https://github.com/decolua/9router
  # Activate: docker compose --profile router up -d
  # 1. Open the dashboard:  http://localhost:${ROUTER_PORT:-20128}/dashboard
  # 2. Log in with the first-login password (ROUTER_INITIAL_PASSWORD, default 123456).
  # 3. Add provider accounts, create a combo + API key, then point the backend
  #    at it in .env (also set LLM_FAILOVER_STRATEGY=9router to disable local key rotation):
  #   LLM_PROVIDER=openai
  #   LLM_API_BASE=http://nine-router:20128/v1   # in-Docker service hostname
  #   OPENAI_API_KEY=<api key generated in the 9router dashboard>
  #   LLM_MODEL=<combo name or provider/model, e.g. cc/claude-opus-4-7>
  nine-router:
    image: decolua/9router:latest
    container_name: ai-collective-9router
    profiles: ["router"]
    ports:
      - "${ROUTER_PORT:-20128}:20128"
    environment:
      - PORT=20128
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - JWT_SECRET=${ROUTER_JWT_SECRET:-change-me-use-openssl-rand-hex-32}
      - INITIAL_PASSWORD=${ROUTER_INITIAL_PASSWORD:-123456}
      - NEXT_PUBLIC_BASE_URL=${ROUTER_PUBLIC_URL:-http://localhost:20128}
    volumes:
      - router_data:/app/data
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:20128/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MinIO object storage (optional — profile: minio) ─────────────────────
  # Durable backup/restore of conversation sandbox files so they survive Pod
  # eviction in k8s mode. Activate: docker compose --profile minio up -d
  # and set MINIO_ENABLED=true for the backend.
  minio:
    image: minio/minio:latest
    container_name: ai-collective-minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
    driver: local
  sandbox-workspace:
  router_data:
  minio_data:

networks:
  ai-collective:
    driver: bridge
