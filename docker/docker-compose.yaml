# AI Collective — Production Environment
# Usage: docker compose -f docker/docker-compose.yaml up -d
#
# Services:
#   - redis:    Lock backend (enable with: lock_backend=redis in .env)
#   - rabbitmq: Task queue   (enable with: task_queue_backend=rabbitmq in .env)
#   - nginx:    Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend: Vite React static server (served by `serve` on port 8080)
#   - backend:  FastAPI application server (port 8000)
#
# Key environment variables (set in .env at project root):
#   RABBITMQ_USER / RABBITMQ_PASS — RabbitMQ credentials (default: guest/guest)
#   GOOGLE_API_KEY                — Google AI API key
#   ANTHROPIC_API_KEY             — Anthropic API key
#   OPENAI_API_KEY                — OpenAI API key
#   CORS_ORIGINS                  — Allowed CORS origins (add http://localhost:2026)
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Redis (distributed lock backend) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-collective-redis
    command: redis-server --save "" --appendonly no
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (task execution queue) ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ai-collective-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ai-collective-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ai-collective
    restart: unless-stopped

  # ── Frontend: Vite React (static production build) ────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: Dockerfile.frontend
      target: prod
    container_name: ai-collective-frontend
    networks:
      - ai-collective
    restart: unless-stopped

  # ── Backend: FastAPI ───────────────────────────────────────────────────────
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    container_name: ai-collective-backend
    command: uv run uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers ${BACKEND_WORKERS:-4}
    volumes:
      - ../logs:/app/logs
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    networks:
      - ai-collective
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  ai-collective:
    driver: bridge
