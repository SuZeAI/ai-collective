# AI Collective — Production Environment
# Usage: docker compose -f docker/docker-compose.yaml up -d
#
# Services:
#   - redis:       Task cancel signals + pause checkpoints
#   - rabbitmq:    Task execution queue
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI Gateway API
#   - langgraph:   LangGraph production server
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set in .env at project root):
#   AI_COLLECTIVE_HOME                   — runtime data dir
#   AI_COLLECTIVE_CONFIG_PATH            — path to config.yaml
#   AI_COLLECTIVE_EXTENSIONS_CONFIG_PATH — path to extensions_config.json
#   AI_COLLECTIVE_DOCKER_SOCKET          — Docker socket path, default /var/run/docker.sock
#   AI_COLLECTIVE_REPO_ROOT              — repo root (used for skills host path in DooD)
#   BETTER_AUTH_SECRET               — required for frontend auth/session security
#   RABBITMQ_USER / RABBITMQ_PASS    — RabbitMQ credentials (default: guest/guest)
#
# Access: http://localhost:${PORT:-2026}

services:
  # ── Redis (task cancel signals + pause checkpoints) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-collective-redis
    command: redis-server --save "" --appendonly no
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (task execution queue) ───────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ai-collective-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ai-collective-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    environment:
      - LANGGRAPH_UPSTREAM=${LANGGRAPH_UPSTREAM:-langgraph:2024}
      - LANGGRAPH_REWRITE=${LANGGRAPH_REWRITE:-/}
    command: >
      sh -c "envsubst '$$LANGGRAPH_UPSTREAM $$LANGGRAPH_REWRITE'
      < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    networks:
      - ai-collective
    restart: unless-stopped

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: ai-collective-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - AI_COLLECTIVE_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - AI_COLLECTIVE_INTERNAL_LANGGRAPH_BASE_URL=http://langgraph:2024
    env_file:
      - ../frontend/.env
    networks:
      - ai-collective
    restart: unless-stopped

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: ai-collective-gateway
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers ${GATEWAY_WORKERS:-4}"
    volumes:
      - ${AI_COLLECTIVE_CONFIG_PATH}:/app/backend/config.yaml:ro
      - ${AI_COLLECTIVE_EXTENSIONS_CONFIG_PATH}:/app/backend/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${AI_COLLECTIVE_HOME}:/app/backend/.ai-collective
      - ${AI_COLLECTIVE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - AI_COLLECTIVE_HOME=/app/backend/.ai-collective
      - AI_COLLECTIVE_CONFIG_PATH=/app/backend/config.yaml
      - AI_COLLECTIVE_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - AI_COLLECTIVE_CHANNELS_LANGGRAPH_URL=${AI_COLLECTIVE_CHANNELS_LANGGRAPH_URL:-http://langgraph:2024}
      - AI_COLLECTIVE_CHANNELS_GATEWAY_URL=${AI_COLLECTIVE_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - AI_COLLECTIVE_HOST_BASE_DIR=${AI_COLLECTIVE_HOME}
      - AI_COLLECTIVE_HOST_SKILLS_PATH=${AI_COLLECTIVE_REPO_ROOT}/skills
      - AI_COLLECTIVE_SANDBOX_HOST=host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── LangGraph Server ───────────────────────────────────────────────────────
  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: ai-collective-langgraph
    command: sh -c 'cd /app/backend && args="--no-browser --no-reload --host 0.0.0.0 --port 2024 --n-jobs-per-worker $${LANGGRAPH_JOBS_PER_WORKER:-10}" && if [ "$${LANGGRAPH_ALLOW_BLOCKING:-0}" = "1" ]; then args="$$args --allow-blocking"; fi && uv run langgraph dev $$args'
    volumes:
      - ${AI_COLLECTIVE_CONFIG_PATH}:/app/backend/config.yaml:ro
      - ${AI_COLLECTIVE_EXTENSIONS_CONFIG_PATH}:/app/backend/extensions_config.json:ro
      - ${AI_COLLECTIVE_HOME}:/app/backend/.ai-collective
      - ../skills:/app/skills:ro
      - ../backend/.langgraph_api:/app/backend/.langgraph_api
      - ${AI_COLLECTIVE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    environment:
      - CI=true
      - AI_COLLECTIVE_HOME=/app/backend/.ai-collective
      - AI_COLLECTIVE_CONFIG_PATH=/app/backend/config.yaml
      - AI_COLLECTIVE_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - AI_COLLECTIVE_HOST_BASE_DIR=${AI_COLLECTIVE_HOME}
      - AI_COLLECTIVE_HOST_SKILLS_PATH=${AI_COLLECTIVE_REPO_ROOT}/skills
      - AI_COLLECTIVE_SANDBOX_HOST=host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective
    restart: unless-stopped

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: ai-collective-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=ai-collective
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${AI_COLLECTIVE_REPO_ROOT}/skills
      - THREADS_HOST_PATH=${AI_COLLECTIVE_HOME}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-collective
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  ai-collective:
    driver: bridge
